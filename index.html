<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Автоматическое перенаправление через HTML (Meta Refresh) -->
    <meta http-equiv="refresh" content="0; url=https://www.wikipedia.org/">
    <title>Redirecting...</title>
    <script>
        // Автоматическое перенаправление через JavaScript
        window.location.href = "https://www.wikipedia.org/";
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            text-align: center;
        }
        .container {
            padding: 20px;
            border-radius: 6px;
            background-color: #161b22;
            border: 1px solid #30363d;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Если перенаправление не произошло автоматически, перейдите по ссылке:</p>
        <p><a href="https://www.wikipedia.org/">Нажмите здесь для продолжения</a></p>
    </div>
</body>
</html>
